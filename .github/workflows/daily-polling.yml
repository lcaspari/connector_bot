name: Daily Polling Session

# Trigger every day at 10:00 UTC
on:
  schedule:
    # Every day at 10:00 UTC
    - cron: '0 10 * * *'
  # Allow manual trigger for testing
  workflow_dispatch:

jobs:
  polling-session:
    name: Start Polling Session (1 hour)
    runs-on: ubuntu-latest
    steps:
      - name: Trigger polling/start endpoint
        run: |
          curl -X POST "${{ secrets.RAILWAY_URL }}/polling/start?duration_minutes=60" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            --fail-with-body
      - name: Check response
        if: failure()
        run: echo "Failed to trigger polling session. Check RAILWAY_URL and CRON_SECRET secrets."
