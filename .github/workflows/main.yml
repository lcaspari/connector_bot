name: Connector Bot Cron Jobs

# Trigger daily at 16:00 UTC (18:00 Berlin time with DST)
on:
  schedule:
    # Every day at 16:00 UTC (roughly 18:00 Europe/Berlin depending on DST)
    - cron: '0 16 * * *'
  # Allow manual trigger for testing
  workflow_dispatch:

jobs:
  ask-for-calls:
    name: Ask for Calls (Full Moon Check)
    runs-on: ubuntu-latest
    steps:
      - name: Trigger /cron/ask endpoint
        run: |
          curl -X POST "${{ secrets.RAILWAY_URL }}/cron/ask?secret=${{ secrets.CRON_SECRET }}" \
            --fail-with-body
      - name: Check response
        if: failure()
        run: echo "Failed to trigger ask_for_calls. Check RAILWAY_URL and CRON_SECRET."

  pair-and-notify:
    name: Pair & Notify (Full Moon Check)
    runs-on: ubuntu-latest
    needs: ask-for-calls
    steps:
      - name: Wait 10 minutes before pairing
        run: sleep 600
      
      - name: Trigger /cron/pair endpoint
        run: |
          curl -X POST "${{ secrets.RAILWAY_URL }}/cron/pair?secret=${{ secrets.CRON_SECRET }}" \
            --fail-with-body
      - name: Check response
        if: failure()
        run: echo "Failed to trigger pair_and_notify. Check RAILWAY_URL and CRON_SECRET."
